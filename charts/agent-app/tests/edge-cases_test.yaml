suite: edge-cases
templates:
  - templates/deployment.yaml
  - templates/cronjob.yaml
  - templates/tests/test-readyz.yaml
  - templates/validations.yaml
release:
  name: demo
  namespace: agents
values:
  - values/base.yaml
tests:
  - it: keeps zero and empty force timeouts consistent with the CLI
    template: templates/deployment.yaml
    set:
      env: {CHAMVI_FORCE_EXIT_MS: 0}
      terminationGracePeriodSeconds: 6
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: CHAMVI_FORCE_EXIT_MS, value: '0'}
  - it: treats an empty force timeout as the CLI default
    template: templates/validations.yaml
    set:
      env: {CHAMVI_FORCE_EXIT_MS: ''}
      terminationGracePeriodSeconds: 95
    asserts:
      - failedTemplate:
          errorPattern: 'must stay below terminationGracePeriodSeconds'
  - it: accepts a force timeout of a million milliseconds from a values file (float64)
    template: templates/deployment.yaml
    set:
      env: {CHAMVI_FORCE_EXIT_MS: 1000000}
      terminationGracePeriodSeconds: 1100
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: CHAMVI_FORCE_EXIT_MS, value: '1000000'}
  - it: omits preStop at zero and accepts extra probe timings
    template: templates/deployment.yaml
    set:
      preStopSleepSeconds: 0
      probes.startup.initialDelaySeconds: 3
      probes.readiness.successThreshold: 2
    asserts:
      - notExists: {path: 'spec.template.spec.containers[0].lifecycle'}
      - equal: {path: 'spec.template.spec.containers[0].startupProbe.initialDelaySeconds', value: 3}
      - equal: {path: 'spec.template.spec.containers[0].readinessProbe.successThreshold', value: 2}
  - it: leaves the scheduler alone without Kubernetes jobs
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: CHAMVI_SCHEDULER, value: 'false'}
  - it: preserves suspend false and job defaults and overrides
    template: templates/cronjob.yaml
    set:
      resources: {limits: {memory: 256Mi}}
      cronJob:
        resources: {limits: {memory: 512Mi}}
        activeDeadlineSeconds: 600
        successfulJobsHistoryLimit: 0
        failedJobsHistoryLimit: 1
      cronJobs:
        - {name: daily, agent: daily, schedule: '0 1 * * *', suspend: false}
    asserts:
      - equal: {path: spec.suspend, value: false}
      - equal: {path: spec.successfulJobsHistoryLimit, value: 0}
      - equal: {path: spec.failedJobsHistoryLimit, value: 1}
      - equal: {path: spec.jobTemplate.spec.activeDeadlineSeconds, value: 600}
      - equal: {path: 'spec.jobTemplate.spec.template.spec.containers[0].resources.limits.memory', value: 512Mi}
      - notExists: {path: 'spec.jobTemplate.spec.template.spec.containers[0].ports'}
      - notExists: {path: 'spec.jobTemplate.spec.template.spec.containers[0].lifecycle'}
      - notExists: {path: 'spec.jobTemplate.spec.template.spec.containers[0].startupProbe'}
  - it: inherits resources for jobs and omits an unset active deadline
    template: templates/cronjob.yaml
    set:
      resources: {requests: {cpu: 100m}}
      cronJobs:
        - {name: daily, agent: daily, schedule: '0 1 * * *'}
    asserts:
      - equal: {path: 'spec.jobTemplate.spec.template.spec.containers[0].resources.requests.cpu', value: 100m}
      - notExists: {path: spec.jobTemplate.spec.activeDeadlineSeconds}
  - it: shares private image settings but never gives the hook credentials or tokens
    template: templates/tests/test-readyz.yaml
    set:
      image.pullPolicy: Never
      imagePullSecrets: [{name: private-image}]
      secrets: [database]
      env: {APP_PASSWORD: not-a-real-credential}
      sandbox: {enabled: true, namespace: sandbox}
    asserts:
      - equal: {path: spec.imagePullSecrets, value: [{name: private-image}]}
      - equal: {path: 'spec.containers[0].imagePullPolicy', value: Never}
      - equal: {path: spec.automountServiceAccountToken, value: false}
      - notExists: {path: 'spec.containers[0].env'}
      - notExists: {path: 'spec.containers[0].envFrom'}
      - equal: {path: 'spec.containers[0].securityContext.allowPrivilegeEscalation', value: false}
  - it: mounts the app token only for sandbox integration
    template: templates/deployment.yaml
    set:
      sandbox: {enabled: true, namespace: sandbox}
    asserts:
      - equal: {path: spec.template.spec.automountServiceAccountToken, value: true}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: CHAMVI_SANDBOX_NAMESPACE, value: sandbox}
