suite: service
templates:
  - templates/service.yaml
release:
  name: demo
  namespace: agents
values:
  - values/base.yaml
tests:
  - it: exposes port 80 to the named container port
    asserts:
      - equal: { path: spec.type, value: ClusterIP }
      - equal: { path: spec.ports, value: [{ name: http, port: 80, targetPort: http, protocol: TCP }] }
      - equal: { path: 'spec.selector["app.kubernetes.io/component"]', value: app }
