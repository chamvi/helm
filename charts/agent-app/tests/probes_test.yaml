suite: probes
templates:
  - templates/deployment.yaml
release:
  name: demo
  namespace: agents
values:
  - values/base.yaml
tests:
  - it: renders the C5 probes, preStop and grace period
    asserts:
      - equal: { path: spec.template.spec.terminationGracePeriodSeconds, value: 120 }
      - equal: { path: 'spec.template.spec.containers[0].lifecycle', value: { preStop: { sleep: { seconds: 5 } } } }
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value: { httpGet: { path: /healthz, port: http }, periodSeconds: 2, failureThreshold: 60, timeoutSeconds: 2 }
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 2 }
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value: { httpGet: { path: /readyz, port: http }, periodSeconds: 5, failureThreshold: 2, timeoutSeconds: 2 }
  - it: prefixes every probe with basePath
    set:
      basePath: /agents
    asserts:
      - equal: { path: 'spec.template.spec.containers[0].startupProbe.httpGet.path', value: /agents/healthz }
      - equal: { path: 'spec.template.spec.containers[0].livenessProbe.httpGet.path', value: /agents/healthz }
      - equal: { path: 'spec.template.spec.containers[0].readinessProbe.httpGet.path', value: /agents/readyz }
