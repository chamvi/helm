suite: security
templates:
  - templates/deployment.yaml
  - templates/serviceaccount.yaml
release:
  name: demo
  namespace: agents
values:
  - values/base.yaml
tests:
  - it: runs as uid 1000 with a read-only root and a writable /tmp
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      - contains: { path: spec.template.spec.volumes, content: { name: tmp, emptyDir: {} } }
      - contains: { path: 'spec.template.spec.containers[0].volumeMounts', content: { name: tmp, mountPath: /tmp } }
  - it: mounts no service account token without the sandbox
    template: templates/deployment.yaml
    asserts:
      - equal: { path: spec.template.spec.automountServiceAccountToken, value: false }
      - equal: { path: spec.template.spec.serviceAccountName, value: demo-agent-app }
  - it: labels the pod as component app and never sandbox
    template: templates/deployment.yaml
    set:
      podLabels: { team: agents }
    asserts:
      - equal: { path: 'spec.template.metadata.labels["app.kubernetes.io/component"]', value: app }
      - equal: { path: spec.template.metadata.labels.team, value: agents }
  - it: creates the ServiceAccount without auto-mount
    template: templates/serviceaccount.yaml
    asserts:
      - isKind: { of: ServiceAccount }
      - equal: { path: metadata.name, value: demo-agent-app }
      - equal: { path: automountServiceAccountToken, value: false }
  - it: uses an existing ServiceAccount
    set:
      serviceAccount: { create: false, name: shared }
    asserts:
      - hasDocuments: { count: 0 }
        template: templates/serviceaccount.yaml
      - equal: { path: spec.template.spec.serviceAccountName, value: shared }
        template: templates/deployment.yaml
  - it: passes resources and scheduling through
    template: templates/deployment.yaml
    set:
      resources: { requests: { cpu: 100m, memory: 256Mi } }
      nodeSelector: { kubernetes.io/arch: arm64 }
      tolerations: [{ key: agents, operator: Exists }]
      podAnnotations: { a: b }
    asserts:
      - equal: { path: 'spec.template.spec.containers[0].resources.requests.memory', value: 256Mi }
      - equal: { path: spec.template.spec.nodeSelector, value: { kubernetes.io/arch: arm64 } }
      - lengthEqual: { path: spec.template.spec.tolerations, count: 1 }
      - equal: { path: spec.template.metadata.annotations.a, value: b }
