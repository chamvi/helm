# basePath, Ingress and the derived CHAMVI_PUBLIC_URL; the ServiceMonitor is skipped on kind (no API).
image:
    repository: chamvi-ci/app
    tag: ci
    pullPolicy: Never
secrets: [agent-app-ci]
basePath: /agents
ingress:
    enabled: true
    host: agents.ci.local
serviceMonitor:
    enabled: true
