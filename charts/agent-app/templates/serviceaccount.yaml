{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-app.serviceAccountName" . | quote }}
  labels:
    {{- include "agent-app.labels" (dict "context" . "component" "app") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- include "agent-app.stringMap" . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
