{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agent-app.fullname" . | quote }}
  labels:
    {{- include "agent-app.labels" (dict "context" . "component" "app") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- include "agent-app.stringMap" . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls.secretName }}
  tls:
    - hosts: [{{ $.Values.ingress.host | quote }}]
      secretName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ default "/" (include "agent-app.basePath" .) | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "agent-app.fullname" . | quote }}
                port:
                  name: http
{{- end }}
